<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }
        body {
            width: 200px;
            padding: 20px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
            background: #ffffff;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
        }
        .icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #4285f4;
            color: white;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            font-family: "Yu Gothic", "Meiryo", sans-serif;
        }
        .title {
            font-size: 14px;
            font-weight: 600;
            color: #202124;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #9aa0a6;
            border-radius: 999px;
            transition: 0.3s;
        }
        .slider::before {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        input:checked + .slider {
            background-color: #34a853;
        }
        input:checked + .slider::before {
            transform: translateX(20px);
        }
        .status {
            margin-top: 14px;
            font-size: 12px;
            color: #5f6368;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="icon">あ</span>
        <span class="title">Furigana Reader</span>
    </div>
    <label class="switch">
        <input type="checkbox" id="toggleBtn">
        <span class="slider"></span>
    </label>
    <div class="status" id="statusText">Loading...</div>
    <script src="dist/popup.js"></script>
</body>
</html>
